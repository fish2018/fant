name: Android AAR and Demo

on:
  pull_request:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant (release uses repository secrets when configured)
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      abis:
        description: Comma-separated Android ABIs
        required: true
        default: arm64-v8a,armeabi-v7a
        type: string
      min_sdk:
        description: Android minimum API level
        required: true
        default: '24'
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_PLATFORM: 'android-37.0'
  ANDROID_BUILD_TOOLS: '37.0.0'
  ANDROID_NDK_VERSION: '29.0.14206865'
  FANT_ZIG_VERSION: '0.16.0'

jobs:
  build:
    name: ${{ (github.event_name == 'workflow_dispatch' && inputs.variant) || (startsWith(github.ref, 'refs/tags/') && 'release') || 'debug' }} / ${{ (github.event_name == 'workflow_dispatch' && inputs.abis) || (startsWith(github.ref, 'refs/tags/') && 'arm64-v8a,armeabi-v7a') || 'arm64-v8a' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            git \
            lld \
            ninja-build \
            pkg-config \
            rsync \
            unzip \
            xz-utils \
            zstd
          python3 -m pip install 'meson>=1.6,<2'
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - name: Install Android SDK, build tools and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          test -f "$ANDROID_SDK_ROOT/platforms/${ANDROID_PLATFORM}/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "$ANDROID_SDK_ROOT/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"

      - name: Set up Zig
        uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.FANT_ZIG_VERSION }}

      - name: Cache downloaded Meson subprojects
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            vendor/*/
            packages/libant/vendor/
          key: fant-android-vendor-${{ hashFiles('vendor/*.wrap', 'vendor/packagefiles/**', 'meson/deps/meson.build') }}
          restore-keys: |
            fant-android-vendor-

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Configure release signing
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.variant == 'release') || (github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')) }}
        env:
          FANT_RELEASE_KEYSTORE_BASE64: ${{ secrets.FANT_RELEASE_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          FANT_RELEASE_KEY_ALIAS: ${{ secrets.FANT_RELEASE_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          FANT_RELEASE_STORE_PASSWORD: ${{ secrets.FANT_RELEASE_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          FANT_RELEASE_KEY_PASSWORD: ${{ secrets.FANT_RELEASE_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$FANT_RELEASE_KEYSTORE_BASE64" || -z "$FANT_RELEASE_KEY_ALIAS" || -z "$FANT_RELEASE_STORE_PASSWORD" ]]; then
            echo "No production signing secrets configured; build-demo.sh will create the signed local Demo release keystore."
            echo "Configure FANT_RELEASE_KEYSTORE_BASE64, FANT_RELEASE_KEY_ALIAS and FANT_RELEASE_STORE_PASSWORD for upgrade-compatible production signing."
            exit 0
          fi
          FANT_RELEASE_KEY_PASSWORD="${FANT_RELEASE_KEY_PASSWORD:-$FANT_RELEASE_STORE_PASSWORD}"
          printf '%s' "$FANT_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fant-release.jks"
          test -s "$RUNNER_TEMP/fant-release.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/fant-release.jks" \
            -storepass "$FANT_RELEASE_STORE_PASSWORD" \
            -alias "$FANT_RELEASE_KEY_ALIAS" >/dev/null
          {
            echo "ANT_DEMO_KEYSTORE=$RUNNER_TEMP/fant-release.jks" >> "$GITHUB_ENV"
            echo "ANT_DEMO_KEY_ALIAS=$FANT_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANT_DEMO_STORE_PASSWORD=$FANT_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANT_DEMO_KEY_PASSWORD=$FANT_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
          }

      - name: Build AAR and Demo APK
        env:
          REQUESTED_VARIANT: ${{ (github.event_name == 'workflow_dispatch' && inputs.variant) || (startsWith(github.ref, 'refs/tags/') && 'release') || 'debug' }}
          REQUESTED_ABIS: ${{ (github.event_name == 'workflow_dispatch' && inputs.abis) || (startsWith(github.ref, 'refs/tags/') && 'arm64-v8a,armeabi-v7a') || 'arm64-v8a' }}
          REQUESTED_MIN_SDK: ${{ (github.event_name == 'workflow_dispatch' && inputs.min_sdk) || '24' }}
        run: |
          set -euo pipefail
          BUILD_ARGS=(
            --abis "$REQUESTED_ABIS"
            --min-sdk "$REQUESTED_MIN_SDK"
            --sdk "$ANDROID_SDK_ROOT"
            --ndk "$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          )
          if [[ "$REQUESTED_VARIANT" == release ]]; then
            BUILD_ARGS+=(--release)
          fi
          ./android/build-demo.sh "${BUILD_ARGS[@]}"

      - name: Verify and collect artifacts
        env:
          REQUESTED_VARIANT: ${{ (github.event_name == 'workflow_dispatch' && inputs.variant) || (startsWith(github.ref, 'refs/tags/') && 'release') || 'debug' }}
          REQUESTED_ABIS: ${{ (github.event_name == 'workflow_dispatch' && inputs.abis) || (startsWith(github.ref, 'refs/tags/') && 'arm64-v8a,armeabi-v7a') || 'arm64-v8a' }}
        run: |
          set -euo pipefail
          APK_DIR="android/demo/app/build/outputs/apk/$REQUESTED_VARIANT"
          APK="$APK_DIR/app-$REQUESTED_VARIANT.apk"
          test -f android/build/ant-runtime.aar
          test -f "$APK"
          test ! -e "$APK_DIR/app-release-unsigned.apk"
          if [[ "$REQUESTED_VARIANT" == release ]]; then
            "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/zipalign" -c -v 4 "$APK"
            "$ANDROID_SDK_ROOT/build-tools/$ANDROID_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          fi

          if [[ "$REQUESTED_VARIANT" == release ]]; then
            case ",$REQUESTED_ABIS," in
              *,armeabi-v7a,*) ;;
              *) echo "Release ABI set must include armeabi-v7a: $REQUESTED_ABIS" >&2; exit 1 ;;
            esac
            case ",$REQUESTED_ABIS," in
              *,arm64-v8a,*) ;;
              *) echo "Release ABI set must include arm64-v8a: $REQUESTED_ABIS" >&2; exit 1 ;;
            esac
            ARMV7_SO="android/build/armeabi-v7a/jniLibs/armeabi-v7a/libant_android.so"
            test -f "$ARMV7_SO"
            ARMV7_HEADER="$("$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$ARMV7_SO")"
            grep -Eq 'Class:[[:space:]]+ELF32' <<<"$ARMV7_HEADER"
            grep -Eq 'Machine:[[:space:]]+ARM' <<<"$ARMV7_HEADER"
            ARM64_SO="android/build/arm64-v8a/jniLibs/arm64-v8a/libant_android.so"
            test -f "$ARM64_SO"
            ARM64_HEADER="$("$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$ARM64_SO")"
            grep -Eq 'Class:[[:space:]]+ELF64' <<<"$ARM64_HEADER"
            grep -Eq 'Machine:[[:space:]]+AArch64' <<<"$ARM64_HEADER"
            AAR_CONTENTS="$(unzip -Z1 android/build/ant-runtime.aar)"
            grep -Fx 'jni/armeabi-v7a/libant_android.so' <<<"$AAR_CONTENTS"
            grep -Fx 'jni/arm64-v8a/libant_android.so' <<<"$AAR_CONTENTS"
          fi

          rm -rf dist
          mkdir -p dist/native
          cp "$APK" "dist/$(basename "$APK")"
          IFS=',' read -r -a ABI_LIST <<< "$REQUESTED_ABIS"
          for abi in "${ABI_LIST[@]}"; do
            mkdir -p "dist/native/$abi"
            cp "android/build/$abi/jniLibs/$abi/libant_android.so" "dist/native/$abi/"

            # The build produces one multi-ABI AAR for Gradle consumption.
            # Publish a separate AAR per ABI so hosts can depend on exactly
            # one native runtime and avoid shipping an unwanted architecture.
            AAR_STAGE="$(mktemp -d)"
            unzip -q android/build/ant-runtime.aar -d "$AAR_STAGE"
            test -f "$AAR_STAGE/jni/$abi/libant_android.so"
            for other_dir in "$AAR_STAGE"/jni/*; do
              [[ -d "$other_dir" ]] || continue
              [[ "$(basename "$other_dir")" == "$abi" ]] || rm -rf "$other_dir"
            done
            jar --create --file "dist/ant-runtime-$abi.aar" -C "$AAR_STAGE" .
            rm -rf "$AAR_STAGE"
            native_entries="$(unzip -Z1 "dist/ant-runtime-$abi.aar" | grep -E '^jni/[^/]+/libant_android\.so$' | wc -l | tr -d ' ')"
            [[ "$native_entries" == 1 ]]
            unzip -Z1 "dist/ant-runtime-$abi.aar" | grep -Fx "jni/$abi/libant_android.so" >/dev/null
          done
          if [[ "$REQUESTED_VARIANT" != release ]]; then
            # Keep the historical universal AAR available in debug workflow
            # artifacts; tag releases intentionally expose only ABI-specific
            # AAR files.
            cp android/build/ant-runtime.aar dist/
          fi
          find dist -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > dist/SHA256SUMS

          {
            echo "## Android artifacts"
            echo
            echo "- Variant: `$REQUESTED_VARIANT`"
            echo "- ABI: `$REQUESTED_ABIS`"
            echo "- APK: `$(stat -c '%n — %s bytes' "$APK")`"
            echo "- AAR: `$(stat -c '%n — %s bytes' android/build/ant-runtime.aar)`"
            if [[ "$REQUESTED_VARIANT" == release ]]; then
              echo "- Signature: verified with APK Signature Scheme v2/v3"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          find dist -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Upload Android artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fant-android-${{ (github.event_name == 'workflow_dispatch' && inputs.variant) || (startsWith(github.ref, 'refs/tags/') && 'release') || 'debug' }}-${{ (github.event_name == 'workflow_dispatch' && inputs.abis) || (startsWith(github.ref, 'refs/tags/') && 'arm64-v8a,armeabi-v7a') || 'arm64-v8a' }}
          path: dist
          if-no-files-found: error
          retention-days: 30

      - name: Publish tag release assets
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          files: |
            dist/ant-runtime-*.aar
            dist/app-release.apk
            dist/SHA256SUMS
          generate_release_notes: true

      - name: Remove decoded release keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/fant-release.jks"
